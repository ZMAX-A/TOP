[project]
name = "testops-platform"
version = "0.30.0"
description = "Multi-project TestOps governance and execution platform"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "cryptography>=46,<51",
  "fastapi>=0.115,<1",
  "prometheus-client>=0.25,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
migration = [
  "openpyxl>=3.1,<4",
]
runner = [
  "playwright==1.62.0",
]
platform = [
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "docker>=7.1,<8",
  "httpx>=0.28,<1",
  "redis>=5.2,<7",
]
kubernetes-executor = [
  "kubernetes>=33,<35",
]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This root project installs the shared development dependencies. Component
# sources remain in their architecture directories and are added by the dev
# entrypoints or pytest's pythonpath setting.
packages = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [
  "packages/contracts/src",
  "apps/api/src",
  "runners/web_playwright/src",
  "packages/migrations/src",
  "services/worker/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/contracts/src",
  "apps/api/src",
  "runners/web_playwright/src",
  "packages/migrations/src",
  "services/worker/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
