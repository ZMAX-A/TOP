# Local Compose validation only. Production must mount an approved receiver configuration.
global:
  resolve_timeout: 5m

route:
  receiver: local-webhook-audit
  group_by:
    - alertname
    - severity
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 4h

receivers:
  - name: local-webhook-audit
    webhook_configs:
      - url: http://alertmanager-sink:8080/alerts
        send_resolved: true
        max_alerts: 20
