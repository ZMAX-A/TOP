server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /alerts {
        limit_except POST {
            deny all;
        }
        return 204;
    }

    location / {
        return 404;
    }
}
