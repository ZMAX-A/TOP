groups:
  - name: testops-control-plane
    rules:
      - alert: TestOpsApiUnavailable
        expr: up{job="testops-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TestOps API cannot be scraped
          description: The control-plane metrics endpoint has been unavailable for two minutes.

      - alert: TestOpsDatabaseNotReady
        expr: testops_database_ready{job="testops-api"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: TestOps database readiness is failing
          description: The latest control-plane database readiness probe has failed for three minutes.

      - alert: TestOpsApiHighErrorRate
        expr: |
          sum(rate(testops_http_requests_total{job="testops-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(testops_http_requests_total{job="testops-api"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TestOps API has a high server-error rate
          description: More than five percent of API requests have returned 5xx for ten minutes.

      - alert: TestOpsApiHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(testops_http_request_duration_seconds_bucket{job="testops-api"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TestOps API p95 latency is high
          description: The five-minute p95 request latency has exceeded two seconds for ten minutes.

      - alert: TestOpsReliabilitySnapshotUnavailable
        expr: testops_reliability_snapshot_success{job="testops-api"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TestOps reliability metrics are unavailable
          description: The API has failed to query Run and scheduler reliability state for five minutes.

      - alert: TestOpsQualityOperationsSnapshotUnavailable
        expr: testops_quality_operations_snapshot_success{job="testops-api"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TestOps quality operations metrics are unavailable
          description: The API has failed to query quality evaluator and Webhook state for five minutes.

      - alert: TestOpsDispatchBacklogOldest
        expr: |
          testops_dispatch_waiting_runs{job="testops-api"} > 0
          and
          testops_dispatch_backlog_oldest_age_seconds{job="testops-api"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TestOps Run dispatch backlog is aging
          description: At least one Run has waited for dispatch capacity for over five minutes.

      - alert: TestOpsRegressionScheduleLag
        expr: |
          testops_schedule_due_backlog{job="testops-api"} > 0
          and
          testops_schedule_lag_seconds{job="testops-api"} > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TestOps regression schedules are delayed
          description: An active regression schedule has remained due for over two minutes.

      - alert: TestOpsStaleRunnerLease
        expr: testops_stale_runner_leases{job="testops-api"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TestOps has stale Runner slot leases
          description: An active Run is bound to a Runner whose heartbeat has expired.

      - alert: TestOpsQualityAlertEvaluatorLag
        expr: |
          testops_quality_alert_evaluation_due_configs{job="testops-api"} > 0
          and
          testops_quality_alert_evaluation_lag_seconds{job="testops-api"} > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TestOps quality alert evaluation is delayed
          description: At least one enabled quality alert configuration has remained due for over ten minutes.

      - alert: TestOpsQualityWebhookPendingBacklog
        expr: |
          testops_quality_webhook_deliveries{job="testops-api",status="PENDING"} > 0
          and
          testops_quality_webhook_oldest_pending_age_seconds{job="testops-api"} > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: TestOps quality Webhook backlog is aging
          description: At least one quality Webhook delivery has remained pending for over ten minutes.
