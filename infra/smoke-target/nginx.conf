server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /login {
        try_files /login.html =404;
    }

    location = /dashboard {
        try_files /dashboard.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
